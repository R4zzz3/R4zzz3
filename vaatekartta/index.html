<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>
<title>Vaatekartta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Spline+Sans+Mono:wght@500&display=swap">
<style>
/* Layout: app shell (top bar, filter row, one view pane); phone gets a bottom tab bar, desktop a right-hand brand panel.
   Idea: raw indigo denim (dark) and the same cloth bleached to chambray (light); shipping facts sewn on as a care label. */
:root {
  --bg: #DCE3EC; --surface: #F4F6F9; --surface-2: #E8EDF3; --ink: #15203A; --ink-2: #48546D; --line: #B4C0D0;
  --label: #FFFFFF; --label-ink: #15203A; --focus: #2449C9;
  --fast: #1F6B45; --mid: #8F5B00; --slow: #A3263A; --like: var(--slow);
  --shadow: 0 -8px 32px rgba(21, 32, 58, .18);
  --f-display: Archivo, "Helvetica Neue", Arial, sans-serif;
  --f-body: Archivo, "Helvetica Neue", Arial, sans-serif;
  --f-label: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "Spline Sans Mono", ui-monospace, Menlo, monospace;
  --bar: 48px; --tabbar: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121B2D; --surface: #1A2540; --surface-2: #22304F; --ink: #E9EDF4; --ink-2: #A4B0C6; --line: #34446A;
    --label: #D9DEE7; --label-ink: #15203A; --focus: #8FB0FF;
    --fast: #5FC48C; --mid: #E3B04B; --slow: #F07A8A; --shadow: 0 -8px 32px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121B2D; --surface: #1A2540; --surface-2: #22304F; --ink: #E9EDF4; --ink-2: #A4B0C6; --line: #34446A;
  --label: #D9DEE7; --label-ink: #15203A; --focus: #8FB0FF;
  --fast: #5FC48C; --mid: #E3B04B; --slow: #F07A8A; --shadow: 0 -8px 32px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

html { box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 1rem; line-height: 1.45;
  overflow: hidden; -webkit-tap-highlight-color: transparent;
}
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.num, .tabular { font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; }
.top { grid-row: 1; } .filters { grid-row: 2; } .panes { grid-row: 3; } .tabbar { grid-row: 4; }
.top {
  height: var(--bar); display: flex; align-items: center; gap: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--bg);
}
.logo { font-family: var(--f-display); font-stretch: 125%; font-weight: 750; font-size: 1.25rem; letter-spacing: -.01em; text-decoration: none; white-space: nowrap; }
.meta { margin: 0; color: var(--ink-2); font-size: .8125rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; border-radius: 8px; flex: none; margin-right: -10px; }
.icon-btn:hover { background: var(--surface-2); }
.tabs { display: none; gap: 4px; }
.tab {
  display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 44px; text-decoration: none; color: var(--ink-2);
  font-weight: 600; font-size: .9375rem; position: relative;
}
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"]::after {
  content: ""; position: absolute; left: 12px; right: 12px; bottom: 4px; height: 0;
  border-bottom: 2px dashed var(--ink); border-image: repeating-linear-gradient(90deg, var(--ink) 0 4px, transparent 4px 7px) 1;
}
.tabbar {
  display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  position: relative; z-index: 6;
}
.tabbar .tab { flex-direction: column; justify-content: center; gap: 2px; height: var(--tabbar); font-size: .8125rem; padding: 0; }
.tabbar .tab[aria-current="page"]::after { bottom: 3px; left: 30%; right: 30%; }

/* ---------- filters ---------- */
.filters {
  display: flex; gap: 8px; align-items: center; padding-block: 8px; min-width: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.chips {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1;
  -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent);
          mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent);
  padding-right: 24px; margin-block: -4px; padding-block: 4px;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  font-size: .875rem; font-weight: 500; white-space: nowrap; flex: none; display: inline-flex; align-items: center; gap: 6px;
  position: relative;
}
.chip::before { content: ""; position: absolute; inset: -4px 0; }
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .ico { width: 16px; height: 16px; }
.chip .count { font-variant-numeric: tabular-nums; color: inherit; opacity: .75; }
select.chip {
  appearance: none; -webkit-appearance: none; padding-right: 30px; color: var(--ink);
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 17px) 16px, calc(100% - 12px) 16px; background-size: 5px 5px; background-repeat: no-repeat;
}
select.chip.on { background-color: var(--ink); color: var(--bg); border-color: var(--ink); }
.feed-only { display: none; }
body[data-view="selaa"] .feed-only { display: inline-flex; }

/* ---------- panes ---------- */
.panes { position: relative; min-height: 0; }
.pane { position: absolute; inset: 0; }

/* map */
.pane-map { background: var(--bg); overflow: hidden; }
#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; }
#map:active { cursor: grabbing; }
.land path { fill: var(--surface); stroke: var(--line); stroke-width: .7; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.land path.fi { fill: var(--surface-2); stroke: var(--ink-2); }
.route { fill: none; vector-effect: non-scaling-stroke; opacity: .75; stroke-linecap: round; transition: opacity .2s; }
.route.s-fast { stroke: var(--fast); stroke-width: 2.5; }
.route.s-mid { stroke: var(--mid); stroke-width: 1.75; stroke-dasharray: 7 4; stroke-linecap: butt; }
.route.s-slow { stroke: var(--slow); stroke-width: 2; stroke-dasharray: .1 4.5; }
.route.s-unknown { stroke: var(--ink-2); stroke-width: 1.25; stroke-dasharray: 2 5; opacity: .55; }
#map.has-sel .route { opacity: .15; }
#map.has-sel .route.sel { opacity: 1; }
.dot { cursor: pointer; outline: none; }
.dot .hit { fill: transparent; }
.dot .pin { fill: var(--surface); stroke-width: 2; }
.dot.s-fast .pin { stroke: var(--fast); } .dot.s-mid .pin { stroke: var(--mid); } .dot.s-slow .pin { stroke: var(--slow); } .dot.s-unknown .pin { stroke: var(--ink-2); }
.dot .n { font: 700 10px/1 var(--f-body); fill: var(--ink); text-anchor: middle; font-variant-numeric: tabular-nums; pointer-events: none; }
.dot:hover .pin, .dot.sel .pin { stroke-width: 3; }
.dot:focus-visible .pin { stroke: var(--focus); stroke-width: 3; }
.dot:focus-visible .hit { r: 14px; stroke: var(--focus); stroke-width: 2; }
#dest .ring { fill: none; stroke: var(--ink); stroke-width: 1.5; }
#dest .core { fill: var(--ink); }
#dest text { font: 600 12px/1 var(--f-body); fill: var(--ink); }
.map-ui { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 16px; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.legend { pointer-events: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px 10px; display: grid; grid-template-columns: auto auto; gap: 4px 16px; font-size: .8125rem; }
.legend p { margin: 0 0 2px; color: var(--ink-2); grid-column: 1 / -1; }
.legend span { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.stitch { width: 24px; height: 8px; flex: none; display: inline-block; vertical-align: middle; }
.stitch line { stroke-width: 2; }
.stitch.s-fast line { stroke: var(--fast); stroke-width: 2.5; }
.stitch.s-mid line { stroke: var(--mid); stroke-dasharray: 7 4; }
.stitch.s-slow line { stroke: var(--slow); stroke-dasharray: .1 4.5; stroke-linecap: round; stroke-width: 2.4; }
.stitch.s-unknown line { stroke: var(--ink-2); stroke-dasharray: 2 5; }
/* an unknown time gets no stitch outside the legend: a grey dotted line reads as "7+ pv" */
.stitch.s-unknown { display: none; }
.legend .stitch.s-unknown { display: inline-block; }
.zoom { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 16px; display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.zoom button { width: 44px; height: 44px; border: 0; background: var(--surface); display: grid; place-items: center; }
.zoom button:hover { background: var(--surface-2); }
@media (min-width: 900px) { body:has(#sheet:not([hidden])) .zoom { right: 396px; } }
.map-count { margin: 0; font-size: .8125rem; color: var(--ink-2); }

/* feed */
.pane-feed { overflow: hidden; }
.feed { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; }
.feed::-webkit-scrollbar { display: none; }
.card {
  height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: grid;
  grid-template-rows: auto minmax(45%, 1fr) auto; position: relative; overflow: hidden;
}
.card-top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px));
  height: 52px;
}
.brand-btn { border: 0; background: none; padding: 0; font-weight: 600; font-size: 1rem; text-align: left; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: baseline; gap: 8px; min-height: 44px; align-items: center; }
.brand-btn small { color: var(--ink-2); font-weight: 400; font-size: .8125rem; }
.like { width: 44px; height: 44px; border: 0; background: none; display: grid; place-items: center; border-radius: 8px; flex: none; }
.like .ico { width: 24px; height: 24px; }
.like[aria-pressed="true"] .ico { fill: var(--like); stroke: var(--like); }
.stage {
  position: relative; min-height: 0; display: grid; place-items: center; overflow: hidden;
  grid-template: minmax(0, 1fr) / minmax(0, 1fr); /* explicit track, so the garment shrinks instead of being cropped */
  background: color-mix(in oklab, var(--surface) 86%, var(--c));
}
.stage .ill { width: min(72%, 300px); height: 88%; display: grid; place-items: center; }
.stage .ill svg { width: 100%; height: 100%; max-height: 100%; }
.stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.stage.has-img .ill { visibility: hidden; }
.heart-pop { position: absolute; width: 96px; height: 96px; left: 50%; top: 50%; translate: -50% -50%; opacity: 0; pointer-events: none; fill: var(--like); stroke: none; }
.card.pop .heart-pop { animation: pop .6s ease-out; }
@keyframes pop { 0% { opacity: 0; scale: .6; } 25% { opacity: .95; scale: 1.1; } 100% { opacity: 0; scale: 1; } }
.info {
  display: grid; gap: 8px; padding-block: 14px 16px; align-content: start; min-width: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.pname-row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; min-width: 0; }
.info h3 {
  margin: 0; font-family: var(--f-display); font-stretch: 125%; font-weight: 750; letter-spacing: -.01em; line-height: 1.1;
  font-size: clamp(1.25rem, 4vw, 1.75rem); text-wrap: balance; min-width: 0;
}
.price { font-family: var(--f-display); font-stretch: 125%; font-weight: 750; font-size: 1.25rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.why { margin: 0; color: var(--ink-2); font-size: .9375rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.info-row { display: flex; gap: 12px; align-items: stretch; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 8px;
  background: var(--ink); color: var(--bg); border: 0; text-decoration: none; font-weight: 600; font-size: .9375rem;
}
.btn:hover { background: color-mix(in oklab, var(--ink) 88%, var(--bg)); }
.feed-count { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: 60px; margin: 0; font-size: .75rem; color: var(--ink-2); font-variant-numeric: tabular-nums; pointer-events: none; z-index: 2; background: color-mix(in oklab, var(--surface) 80%, transparent); padding: 2px 6px; border-radius: 4px; }
.empty { height: 100%; display: grid; place-items: center; padding-inline: 32px; text-align: center; color: var(--ink-2); }
.empty p { max-width: 24rem; }

/* care label */
.care {
  --fast: #1F6B45; --mid: #8F5B00; --slow: #A3263A; --ink-2: #48546D;
  background: var(--label); color: var(--label-ink); border: 1px solid var(--line); border-radius: 2px;
  padding: 14px 12px 10px; position: relative; max-width: 16rem;
  font-family: var(--f-label); font-stretch: 75%; font-weight: 500; font-size: .9375rem; line-height: 1.35;
  display: grid; gap: 1px; font-variant-numeric: tabular-nums;
}
.care::before { content: ""; position: absolute; left: 6px; right: 6px; top: 5px; border-top: 1px dashed color-mix(in oklab, #48546D 45%, transparent); }
.care span { display: flex; align-items: center; gap: 6px; }
.care b { font-weight: 700; }
.care.compact { padding: 12px 10px 8px; font-size: .875rem; flex: none; justify-self: start; min-width: min(100%, 15rem); }
.coupon { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .875rem; min-width: 0; }
.coupon .deal { min-width: 0; }
.unv { color: var(--ink-2); font-size: .75rem; white-space: nowrap; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; margin-left: 2px; }
.code {
  font-family: var(--f-mono); font-weight: 500; font-size: .875rem; border: 1px dashed var(--ink-2); background: var(--surface);
  border-radius: 4px; padding: 6px 10px; min-height: 36px; display: inline-flex; align-items: center; gap: 8px; letter-spacing: .02em;
}
.code em { font-family: var(--f-body); font-style: normal; font-size: .8125rem; color: var(--ink-2); letter-spacing: 0; }
.cp-line { margin: 0; font-size: .875rem; color: var(--ink); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cp-line .code { min-height: 30px; padding: 3px 8px; font-size: .8125rem; position: relative; }
.cp-line .code::after { content: ""; position: absolute; inset: -7px -2px; }

/* list */
.pane-list { overflow-y: auto; }
.list { max-width: 60rem; padding-block: 4px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.list table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.list th { position: sticky; top: 0; background: var(--surface-2); text-align: left; font-weight: 500; font-size: .8125rem; color: var(--ink-2); padding: 0; z-index: 1; }
.list th button { border: 0; background: none; width: 100%; min-height: 44px; padding: 0 12px; display: flex; align-items: center; gap: 4px; text-align: inherit; color: inherit; font-weight: inherit; }
.list th.num button { justify-content: flex-end; }
.list th[aria-sort="ascending"] button, .list th[aria-sort="descending"] button { color: var(--ink); font-weight: 700; }
.list th .ico { width: 14px; height: 14px; }
.list td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; font-size: .9375rem; }
.list td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.list tr.row { cursor: pointer; }
.list tr.row:focus-visible { outline-offset: -2px; }
.list tr.row:hover td { background: color-mix(in oklab, var(--surface) 70%, var(--surface-2)); }
.list .bname { font-weight: 600; display: block; }
.list .sub { display: block; color: var(--ink-2); font-size: .8125rem; }
.cc { display: inline-block; border: 1px solid var(--ink-2); border-radius: 3px; padding: 0 4px; font-size: .6875rem; line-height: 1.4; margin-left: 6px; vertical-align: 1px; color: var(--ink-2); font-weight: 600; }
.days { display: inline-flex; align-items: center; gap: 6px; }
.list tr.row[aria-expanded="true"] td, .list tr.open-detail td { background: var(--surface-2); }
.list tr.open-detail td { border-top: 0; padding-top: 2px; padding-bottom: 16px; }
.detail { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.detail .side { display: grid; gap: 10px; min-width: 0; flex: 1 1 14rem; }
.detail .style { margin: 0; color: var(--ink-2); font-size: .875rem; }
.list-note { color: var(--ink-2); font-size: .8125rem; margin: 12px 0 0; max-width: 60ch; }

/* sheet */
.sheet { position: fixed; inset: 0 0 calc(var(--tabbar) + env(safe-area-inset-bottom, 0px)); z-index: 5; display: flex; align-items: flex-end; }
.sheet-card {
  width: 100%; max-height: 72%; overflow-y: auto; background: var(--surface); border-radius: 12px 12px 0 0; box-shadow: var(--shadow);
  padding-block: 8px 20px; position: relative; animation: rise .2s ease-out;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@keyframes rise { from { translate: 0 24px; opacity: .4; } }
.grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 4px; }
.sheet-close { position: absolute; top: 6px; right: max(6px, env(safe-area-inset-right, 0px)); margin-right: 0; }
.sheet-body { display: grid; gap: 14px; }
.bh { padding-right: 40px; }
.bh h2 { margin: 0; font-family: var(--f-display); font-stretch: 125%; font-weight: 750; font-size: 1.5625rem; line-height: 1.1; letter-spacing: -.01em; }
.bh p { margin: 2px 0 0; color: var(--ink-2); font-size: .875rem; }
.bh .style { color: var(--ink); font-size: .9375rem; margin-top: 8px; }
.ret { margin: 0; color: var(--ink-2); font-size: .8125rem; }
.picks { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
.picks h3 { font-size: .8125rem; font-weight: 500; color: var(--ink-2); margin: 10px 0 2px; }
.pline { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 0; text-align: left; font-size: .9375rem; }
.pline:hover { background: var(--surface-2); }
.pline .swatch { width: 14px; height: 14px; border-radius: 3px; background: var(--c); border: 1px solid color-mix(in oklab, var(--c) 70%, var(--ink)); flex: none; }
.pline .pn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pline .pt { color: var(--ink-2); font-size: .8125rem; flex: none; }
.pline .pp { font-variant-numeric: tabular-nums; font-weight: 600; flex: none; }
.blist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.bline { display: grid; gap: 2px; width: 100%; padding: 10px 0; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; }
.bline:hover { background: var(--surface-2); }
.bline .bn { font-weight: 600; }
.bline .bm { color: var(--ink-2); font-size: .8125rem; display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.sheet .btn { width: 100%; }

.toast { position: fixed; left: 50%; translate: -50% 0; bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 16px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: .875rem; z-index: 9; max-width: calc(100% - 32px); }

/* phone: hide top bar in feed so the card owns the screen */
@media (max-width: 899px) {
  body[data-view="selaa"] .top { display: none; }
  .meta { display: none; }
  .top { justify-content: space-between; }
}

@media (max-width: 599px) {
  .list td, .list th button { padding-inline: 6px; }

<script>/* Vaatekartta: flat-lay garment illustrations.
 * Plain browser script. Usage: el.innerHTML = window.garmentSVG('farkut', '#1c2433');
 * Types: farkut, housut, neuleet, paidat, t-paidat, collegit, takit, asusteet.
 * Every tone (seams, shadow, outline) is derived from the one product colour, so a
 * garment reads on both light and dark backgrounds. No ids or defs: safe to repeat.
 */
(function () {
  'use strict';

  var THREAD = '#d9a441';   // classic gold denim topstitch
  var METAL = '#b8925a';    // rivets and shank button
  var ECRU = [233, 228, 214]; // undyed weft, inside of denim
  var DEFAULTS = { farkut: '#22304d', housut: '#b49a6e', neuleet: '#d8cfbd', paidat: '#6b4a3a',
    't-paidat': '#e9e6df', collegit: '#8a9099', takit: '#1f2a3d', asusteet: '#5d6a3a' };

  /* ---------- colour ---------- */
  function rgb(c) {
    var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(c || '').trim());
    if (!m) return null;
    var h = m[1].length === 3 ? m[1].replace(/(.)/g, '$1$1') : m[1];
    return [0, 2, 4].map(function (i) { return parseInt(h.substr(i, 2), 16); });
  }
  function hex(a) {
    return '#' + a.map(function (v) {
      return ('0' + Math.round(Math.max(0, Math.min(255, v))).toString(16)).slice(-2);
    }).join('');
  }
  function mix(a, b, t) { return a.map(function (v, i) { return v + (b[i] - v) * t; }); }
  function lum(a) {
    var c = a.map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  function tones(color, type) {
    var c = rgb(color) || rgb(DEFAULTS[type] || '#8a9099');
    var L = lum(c), dark = L < 0.09, K = [0, 0, 0], W = [255, 255, 255];
    return {
      base: hex(c),
      seam: hex(dark ? mix(c, W, 0.24) : mix(c, K, 0.3)),          // seams, ribs, stitching
      deep: hex(mix(c, K, dark ? 0.4 : 0.42)),                       // openings, pocket bags
      hi: hex(mix(c, W, dark ? 0.3 : 0.24)),                         // buttons, pressed creases
      line: hex(L > 0.3 ? mix(c, K, 0.5) : mix(c, W, dark ? 0.4 : 0.32)), // outer outline
      inside: hex(mix(c, ECRU, 0.62))                                // turned-up cuff

  /* ---------- drawing helpers ---------- */
  function attrs(stroke, w, dash, op) {
    return (stroke ? ' stroke="' + stroke + '" stroke-width="' + (w || 1.3) + '" stroke-linecap="round" stroke-linejoin="round"' : '') +
      (dash ? ' stroke-dasharray="' + dash + '"' : '') + (op ? ' opacity="' + op + '"' : '');
  }
  function fillp(d, fill, stroke, w, op) { return '<path d="' + d + '" fill="' + fill + '"' + attrs(stroke, w, null, op) + '/>'; }
  function line(d, stroke, w, dash, op) { return '<path d="' + d + '" fill="none"' + attrs(stroke, w, dash, op) + '/>'; }
  function dot(x, y, r, fill, stroke, w) { return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + fill + '"' + attrs(stroke, w) + '/>'; }
  function mirror(s) { return s + '<g transform="matrix(-1 0 0 1 200 0)">' + s + '</g>'; }
  function lerp(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }
  function q(p0, p1, p2, t) { var u = 1 - t; return [u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0], u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]]; }
  function f(p) { return p[0].toFixed(1) + ' ' + p[1].toFixed(1); }
  /* rib lines between edge a-b and edge d-c (quad a,b,c,d) */
  function ribs(a, b, c, d, n, stroke, op) {

  const store = {
    get(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        return v == null ? fallback : JSON.parse(v);
      } catch {
        return fallback;
      }
    },
    set(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {
        /* storage blocked: the choice lasts for this visit */
      }
    },
  };
  const state = { type: 'all', country: 'all', likedOnly: false, sort: { key: 'name', dir: 1 }, open: null };
  const likes = new Set(store.get('vk-likes', []));

  // ---------- theme ----------
  const savedTheme = store.get('vk-theme', null);
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  $('#theme').addEventListener('click', () => {
    const dark =
      document.documentElement.dataset.theme === 'dark' ||
      (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    const next = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    store.set('vk-theme', next);
  });

  // ---------- formatting ----------
  const nf = new Intl.NumberFormat('fi-FI', { maximumFractionDigits: 2 });
  const eur = (n) => (n == null ? null : `${nf.format(n)} €`);
  const dayRange = (d) => (!d ? null : d[0] === d[1] ? `${d[0]}` : `${d[0]}–${d[1]}`);
  const countryName = (c) => COUNTRY[c]?.[0] ?? c;
  const countryFrom = (c) => COUNTRY[c]?.[1] ?? c;
  const esc = (s) =>
    String(s ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
  const nonEu = (b) => b.ship.vat !== 'eu';
  const bestCoupon = (b) => b.coupons[0] ?? null;
  const minPrice = (b) => Math.min(...b.products.map((p) => p.price));

  const stitch = (speed) =>
    `<svg class="stitch s-${speed}" viewBox="0 0 24 8" aria-hidden="true"><line x1="${speed === 'slow' ? 2 : 1}" y1="4" x2="23" y2="4"/></svg>`;
  const SPEED_WORD = { fast: '1–3 pv', mid: '4–6 pv', slow: '7+ pv', unknown: 'ei tietoa' };

  function costText(b) {
    if (b.ship.cost === 0) return 'Toimitus ilmainen';
    if (b.ship.cost == null) return 'Toimitus: hinta kassalla';
    return `Toimitus ${eur(b.ship.cost)}`;
  }
  function vatText(b) {
    if (b.ship.vat === 'ioss' || b.ship.vat === 'ddp') return 'ALV ja tulli maksetaan kassalla';
    if (b.ship.vat === 'buyer') return '<b>ALV ja tulli maksetaan perillä</b>';
    return null;
  }

  // The care label: max four facts, "Made in" becomes where the parcel leaves from.
  function careLabel(b, compact = false) {
    const d = dayRange(b.ship.days);
    const lines = compact
      ? [
          `<span>${costText(b)}${b.ship.freeOver ? `, ilmainen yli ${eur(b.ship.freeOver)}` : ''}</span>`,
          `<span>${stitch(b.ship.speed)}${d ? `${d} pv Suomeen` : 'Toimitusaika ei tiedossa'}</span>`,
        ]
      : [
          `<span>${costText(b)}</span>`,
          b.ship.freeOver ? `<span>Ilmainen yli ${eur(b.ship.freeOver)}</span>` : null,
          `<span>${stitch(b.ship.speed)}${d ? `${d} arkipäivää` : 'Toimitusaika ei tiedossa'}</span>`,
          `<span>${vatText(b) ?? `Lähtee ${countryFrom(b.ship.fromCountry)}`}</span>`,
        ];
    if (compact && vatText(b)) lines.push(`<span>${vatText(b)}</span>`);
    return `<div class="care${compact ? ' compact' : ''}">${lines.filter(Boolean).join('')}</div>`;
  }

  function couponHTML(c, cls = 'coupon') {
    if (!c) return '';
    const code = c.code
      ? `<button type="button" class="code" data-copy="${esc(c.code)}">${esc(c.code)} <em>Kopioi</em></button>`
      : '';
    const unverified = c.verified ? '' : ' <span class="unv">ei vahvistettu</span>';
    return `<div class="${cls}"><span class="deal">${esc(c.deal)}${unverified}</span>${code}</div>`;
  }

  // ---------- icons ----------
  const heart = `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.4C1.4 7.6 3.6 4 7.2 4c2 0 3.6 1.1 4.8 2.8C13.2 5.1 14.8 4 16.8 4c3.6 0 5.8 3.6 4.5 7.1-1.8 4.8-9.3 9.4-9.3 9.4z"/></svg>`;
  const heartPop = `<svg class="heart-pop" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.4C1.4 7.6 3.6 4 7.2 4c2 0 3.6 1.1 4.8 2.8C13.2 5.1 14.8 4 16.8 4c3.6 0 5.8 3.6 4.5 7.1-1.8 4.8-9.3 9.4-9.3 9.4z"/></svg>`;
  const ext = `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>`;
  const sortIco = (dir) =>
    `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="${dir === 1 ? 'M12 19V5M6 11l6-6 6 6' : 'M12 5v14M6 13l6 6 6-6'}"/></svg>`;

  // ---------- filters ----------
  const passCountry = (b) =>
    state.country === 'all' || (state.country === 'eu' ? !nonEu(b) : b.country === state.country);
  const brandVisible = (b) => (state.type === 'all' || b.tags.includes(state.type)) && passCountry(b);
  const productVisible = (p) =>
    (state.type === 'all' || p.type === state.type) && passCountry(p.brand) && (!state.likedOnly || likes.has(p.key));

  const countries = [...new Set(brands.map((b) => b.country))].sort((a, b) => countryName(a).localeCompare(countryName(b), 'fi'));

  function renderFilters() {
    const types = Object.keys(TYPE).filter((t) => brands.some((b) => b.tags.includes(t)));
    const opts = [['all', 'Kaikki maat'], ['eu', 'Vain EU, ei tullia'], ...countries.map((c) => [c, countryName(c)])]
      .map(([v, l]) => `<option value="${v}"${state.country === v ? ' selected' : ''}>${l}</option>`)
      .join('');
    const chips = [['all', 'Kaikki'], ...types.map((t) => [t, TYPE[t]])]
      .map(([v, l]) => `<button type="button" class="chip" data-type="${v}" aria-pressed="${state.type === v}">${l}</button>`)
      .join('');
    $('#filters').innerHTML =
      `<div class="chips" role="group" aria-label="Suodata">` +
      `<button type="button" class="chip feed-only" data-liked aria-pressed="${state.likedOnly}">${heart}Tykätyt <span class="count" id="like-count">${likes.size}</span></button>` +
      `<select class="chip${state.country === 'all' ? '' : ' on'}" id="country" aria-label="Maa">${opts}</select>` +
      chips +
      `</div>`;
  }

  $('#filters').addEventListener('click', (e) => {
    const chip = e.target.closest('button');
    if (!chip) return;
    if (chip.dataset.type) state.type = chip.dataset.type;
    if ('liked' in chip.dataset) state.likedOnly = !state.likedOnly;
    state.open = null;
    renderFilters();
    renderAll(true);
  });
  $('#filters').addEventListener('change', (e) => {
    if (e.target.id !== 'country') return;
    state.country = e.target.value;
    state.open = null;
    renderFilters();
    renderAll(true);
  });

  // ---------- map ----------
  const svg = $('#map');
  const routesG = $('#routes');
  const dotsG = $('#dots');
  const [VW, VH] = D.view;
  const dest = D.dest;
  let vb = [0, 0, VW, VH];
  let selected = null;

  const SPEED_RANK = { fast: 0, mid: 1, slow: 2, unknown: 3 };
  // Shops closer than 16 screen pixels share one marker, so dots never overlap at any zoom.
  function clusters() {
    const reach = unitsPerPx() * 16;
    const groups = [];
    for (const b of brands) {
      if (!b.ship.xy || !brandVisible(b)) continue;
      const near = groups.find((g) => Math.hypot(g.xy[0] - b.ship.xy[0], g.xy[1] - b.ship.xy[1]) < reach);
      if (near) near.brands.push(b);
      else groups.push({ key: b.id, xy: b.ship.xy, brands: [b] });
    }
    return groups.map((c) => ({
      ...c,
      speed: c.brands.map((b) => b.ship.speed).sort((a, b) => SPEED_RANK[a] - SPEED_RANK[b])[0],
    }));
  }

  const placeOf = (c) =>
    [...new Set(c.brands.map((b) => b.ship.from || countryName(b.country)))].slice(0, 3).join('; ');

  function routePath([x1, y1], [x2, y2]) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    const len = Math.hypot(dx, dy) || 1;
    const bend = len * 0.18;
    // perpendicular that points north (negative y)
    let nx = dy / len;
    let ny = -dx / len;
    if (ny > 0) {
      nx = -nx;
      ny = -ny;
    }
    return `M${x1},${y1} Q${(x1 + x2) / 2 + nx * bend},${(y1 + y2) / 2 + ny * bend} ${x2},${y2}`;
  }

  function unitsPerPx() {
    const r = svg.getBoundingClientRect();
    if (!r.width || !r.height) return vb[2] / VW;
    return Math.max(vb[2] / r.width, vb[3] / r.height);
  }

  function renderMap() {
    const cs = clusters().sort((a, b) => SPEED_RANK[b.speed] - SPEED_RANK[a.speed]);
    const k = unitsPerPx();
    svg.classList.toggle('has-sel', Boolean(selected));
    routesG.innerHTML = cs
      .map((c) => `<path class="route s-${c.speed}${selected === c.key ? ' sel' : ''}" d="${routePath(c.xy, dest)}"/>`)
      .join('');
    dotsG.innerHTML = '';
    for (const c of cs) {
      const g = document.createElementNS(SVGNS, 'g');
      g.setAttribute('class', `dot s-${c.speed}${selected === c.key ? ' sel' : ''}`);
      g.setAttribute('transform', `translate(${c.xy[0]},${c.xy[1]}) scale(${k})`);
      g.setAttribute('tabindex', '0');
      g.setAttribute('role', 'button');
      const names = c.brands.map((b) => b.name).join(', ');
      g.setAttribute('aria-label', `${names}, ${placeOf(c)}`);
      const n = c.brands.length;
      const r = selected === c.key ? 7 : n > 1 ? 9 : 5;
      g.innerHTML =
        `<title>${esc(names)}</title><circle class="hit" r="22"/><circle class="pin" r="${n > 1 ? Math.max(r, 9) : r}"/>` +
        (n > 1 ? `<text class="n" dy="3.5">${n}</text>` : '');
      g.addEventListener('click', () => openCluster(c));
      g.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openCluster(c);
        }
      });
      dotsG.appendChild(g);
    }
    $('#dest').setAttribute('transform', `translate(${dest[0]},${dest[1]}) scale(${k})`);
    const shown = cs.reduce((n, c) => n + c.brands.length, 0);
    $('#map-count').textContent = `${shown} kauppaa kartalla`;
  }

  function setViewBox(next) {
    let [x, y, w, h] = next;
    const minW = VW / 10;
    if (w < minW) {
      const s = minW / w;
      x -= ((s - 1) * w) / 2;
      y -= ((s - 1) * h) / 2;
      w = minW;
      h *= s;
    }
    if (w > VW * 1.6) return;
    vb = [x, y, w, h];
    svg.setAttribute('viewBox', vb.map((v) => v.toFixed(1)).join(' '));
    renderMap();
  }

  function fitTo(points, pad = 50) {
    const box = svg.getBoundingClientRect();
    if (!box.width || !box.height || !points.length) return;
    const xs = points.map((p) => p[0]);
    const ys = points.map((p) => p[1]);
    // leave room for the legend (bottom-left) and zoom buttons (bottom-right)
    const padPx = { top: 24, right: 24, bottom: 150, left: 24 }; // zoom buttons sit inside the bottom strip
    const w0 = Math.max(...xs) - Math.min(...xs) + pad * 2;
    const h0 = Math.max(...ys) - Math.min(...ys) + pad * 2;
    const s = Math.max(w0 / (box.width - padPx.left - padPx.right), h0 / (box.height - padPx.top - padPx.bottom));
    const w = box.width * s;
    const h = box.height * s;
    const x = Math.min(...xs) - pad - padPx.left * s - ((box.width - padPx.left - padPx.right) * s - w0) / 2;
    const y = Math.min(...ys) - pad - padPx.top * s - ((box.height - padPx.top - padPx.bottom) * s - h0) / 2;
    setViewBox([x, y, w, h]);
  }

  function fitData() {
    const pts = brands.filter((b) => b.ship.xy && brandVisible(b)).map((b) => b.ship.xy);
    fitTo(pts.concat([dest]));
  }

  function zoom(factor, cx, cy) {
    const [x, y, w, h] = vb;
    const px = cx ?? x + w / 2;
    const py = cy ?? y + h / 2;
    setViewBox([px - (px - x) * factor, py - (py - y) * factor, w * factor, h * factor]);
  }

  function clientToMap(clientX, clientY) {
    const r = svg.getBoundingClientRect();
    const s = unitsPerPx();
    const offX = (r.width - vb[2] / s) / 2;
    const offY = (r.height - vb[3] / s) / 2;
    return [vb[0] + (clientX - r.left - offX) * s, vb[1] + (clientY - r.top - offY) * s];
  }

  svg.addEventListener(
    'wheel',
    (e) => {
      e.preventDefault();
      const [mx, my] = clientToMap(e.clientX, e.clientY);
      zoom(e.deltaY > 0 ? 1.15 : 1 / 1.15, mx, my);
    },
    { passive: false }
  );

  const pointers = new Map();
  let pinch = null;
  let moved = 0;
  svg.addEventListener('pointerdown', (e) => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) moved = 0;
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const mid = clientToMap((a.x + b.x) / 2, (a.y + b.y) / 2);
      pinch = { dist: Math.hypot(a.x - b.x, a.y - b.y), vb: [...vb], mid };
    }
  });
  svg.addEventListener('pointermove', (e) => {
    const prev = pointers.get(e.pointerId);
    if (!prev) return;
    const cur = { x: e.clientX, y: e.clientY };
    pointers.set(e.pointerId, cur);
    if (pointers.size === 1) {
      const dx = cur.x - prev.x;
      const dy = cur.y - prev.y;
      moved += Math.abs(dx) + Math.abs(dy);
      if (moved > 6) {
        const s = unitsPerPx();
        setViewBox([vb[0] - dx * s, vb[1] - dy * s, vb[2], vb[3]]);
      }
    } else if (pointers.size === 2 && pinch) {
      moved = 99;
      const [a, b] = [...pointers.values()];
      const f = pinch.dist / (Math.hypot(a.x - b.x, a.y - b.y) || 1);
      const [x, y, w, h] = pinch.vb;
      const [mx, my] = pinch.mid;
      setViewBox([mx - (mx - x) * f, my - (my - y) * f, w * f, h * f]);
    }
  });
  const endPointer = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
  };
  svg.addEventListener('pointerup', endPointer);
  svg.addEventListener('pointercancel', endPointer);
  svg.addEventListener('pointerleave', endPointer);
  // a drag that ends on a dot is not a tap
  svg.addEventListener(
    'click',
    (e) => {
      if (moved > 6) {
        e.stopPropagation();
        e.preventDefault();
      }
      moved = 0;
    },
    true
  );

  $('#zoom-in').addEventListener('click', () => zoom(1 / 1.5));
  $('#zoom-out').addEventListener('click', () => zoom(1.5));
  $('#zoom-fit').addEventListener('click', fitData);

  // ---------- brand sheet ----------
  const sheet = $('#sheet');
  const sheetBody = $('#sheet-body');
  let lastFocus = null;

  function openSheet(html) {
    if (sheet.hidden) lastFocus = document.activeElement;
    sheetBody.innerHTML = html;
    sheet.hidden = false;
    sheet.querySelector('.sheet-card').scrollTop = 0;
    $('#sheet-close').focus({ preventScroll: true });
  }
  function closeSheet() {
    sheet.hidden = true;
    if (selected) {
      selected = null;
      renderMap();
    }
    lastFocus?.focus?.({ preventScroll: true });
  }
  $('#sheet-close').addEventListener('click', closeSheet);
  sheet.addEventListener('click', (e) => {
    if (e.target === sheet) closeSheet();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !sheet.hidden) closeSheet();
  });

  function picksHTML(b) {
    return (
      `<ul class="picks" aria-label="Tunnetuimmat vaatteet">` +
      b.products
        .map(
          (p, i) =>
            `<li><button type="button" class="pline" data-goto="${b.id}:${i}">` +
            `<span class="swatch" style="--c:${p.color}"></span><span class="pn">${esc(p.name)}</span>` +
            `<span class="pt">${TYPE_ONE[p.type]}</span><span class="pp">${eur(p.price)}</span></button></li>`
        )
        .join('') +
      `</ul>`
    );
  }

  function brandHTML(b) {
    const where = [b.city, countryName(b.country)].filter(Boolean).join(', ');
    return (
      `<header class="bh"><h2 id="sheet-title">${esc(b.name)}</h2><p>${esc(where)}${b.parent ? `, osa ${esc(b.parent)}-konsernia` : ''}</p>` +
      (b.style ? `<p class="style">${esc(b.style)}</p>` : '') +
      `</header>` +
      careLabel(b) +
      (b.ship.returns ? `<p class="ret">Palautus: ${esc(b.ship.returns)}</p>` : '') +
      b.coupons.slice(0, 3).map((c) => couponHTML(c)).join('') +
      picksHTML(b) +
      `<a class="btn" href="${esc(b.url)}" target="_blank" rel="noopener">Avaa kauppa ${ext}</a>`
    );
  }

  function openBrand(b) {
    openSheet(brandHTML(b));
  }

  // desktop: the brand panel covers the right edge of the map, so pan the chosen marker clear of it
  function keepClear([x]) {
    if (innerWidth < 900) return;
    const r = svg.getBoundingClientRect();
    const s = unitsPerPx();
    const screenX = r.left + (r.width - vb[2] / s) / 2 + (x - vb[0]) / s;
    const limit = r.right - 404;
    if (screenX > limit) setViewBox([vb[0] + (screenX - limit + 40) * s, vb[1], vb[2], vb[3]]);
  }

  function openCluster(c) {
    selected = c.key;
    renderMap();
    keepClear(c.xy);
    if (c.brands.length === 1) return openBrand(c.brands[0]);
    const items = c.brands
      .map((b) => {
        const d = dayRange(b.ship.days);
        return (
          `<li><button type="button" class="bline" data-brand="${b.id}"><span class="bn">${esc(b.name)}</span>` +
          `<span class="bm">${stitch(b.ship.speed)}${d ? `${d} pv` : 'aika ei tiedossa'}, ${b.ship.cost == null ? 'postikulut kassalla' : eur(b.ship.cost)}</span></button></li>`
        );
      })
      .join('');
    openSheet(
      `<header class="bh"><h2 id="sheet-title">${c.brands.length} kauppaa</h2><p>${esc(placeOf(c))}</p></header><ul class="blist">${items}</ul>`
    );
  }

  sheetBody.addEventListener('click', (e) => {
    const brandBtn = e.target.closest('[data-brand]');
    if (brandBtn) return openBrand(byId.get(brandBtn.dataset.brand));
    const go = e.target.closest('[data-goto]');
    if (go) {
      closeSheet();
      if (state.likedOnly || state.type !== 'all' || state.country !== 'all') {
        Object.assign(state, { likedOnly: false, type: 'all', country: 'all' });
        renderFilters();
        renderAll(false);
      }
      location.hash = 'selaa';
      requestAnimationFrame(() => requestAnimationFrame(() => scrollFeedTo(go.dataset.goto)));
    }
  });

  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-copy]');
    if (!btn) return;
    const text = btn.dataset.copy;
    const label = btn.querySelector('em');
    try {
      await navigator.clipboard.writeText(text);
      if (label) label.textContent = 'Kopioitu';
      toast(`Koodi ${text} kopioitu`);
    } catch {
      const range = document.createRange();
      range.selectNodeContents(btn.firstChild?.nodeType === 3 ? btn : btn);
      const sel = getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      toast('Koodi valittu. Kopioi se itse.');
    }
  });

  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (t.hidden = true), 2200);
  }

  // ---------- feed ----------
  const feed = $('#feed');

  // Shops take turns so the same one never shows twice in a row; each shop's best-known piece comes first.
  function feedOrder() {
    let seed = 20261029;
    const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
    const queues = brands.map((b) => allProducts.filter((p) => p.brand === b).sort((a, c) => Number(c.sig) - Number(a.sig)));
    for (let i = queues.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [queues[i], queues[j]] = [queues[j], queues[i]];
    }
    // within each round, autumn pieces (jeans, knits, jackets, shirts) come before tees and accessories
    const light = new Set(['t-paidat', 'asusteet']);
    const out = [];
    while (queues.some((q) => q.length)) {
      const round = queues.filter((q) => q.length).map((q) => q.shift());
      out.push(...round.filter((p) => !light.has(p.type)), ...round.filter((p) => light.has(p.type)));
    }
    return out;
  }
  const ordered = feedOrder();

  function stage(p) {
    const ill = window.garmentSVG ? window.garmentSVG(p.type, p.color) : '';
    const img = p.image
      ? `<img src="${esc(p.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()" onload="this.parentNode.classList.add('has-img')">`
      : '';
    return `<div class="stage" style="--c:${p.color}"><div class="ill">${ill}</div>${img}${heartPop}</div>`;
  }

  function cardHTML(p) {
    const b = p.brand;
    const c = bestCoupon(b);
    return (
      `<article class="card" data-key="${p.key}" aria-label="${esc(b.name)}, ${esc(p.name)}, ${eur(p.price)}">` +
      stage(p) +
      `<div class="side-col">` +
      `<div class="card-top"><button type="button" class="brand-btn" data-brand-open="${b.id}">${esc(b.name)} <small>${countryName(b.country)}</small></button>` +
      `<button type="button" class="like" data-like="${p.key}" aria-pressed="${likes.has(p.key)}" aria-label="Tykkää: ${esc(p.name)}">${heart}</button></div>` +
      `<div class="info">` +
      `<div class="pname-row"><h3>${esc(p.name)}</h3><span class="price">${eur(p.price)}</span></div>` +
      (p.why ? `<p class="why">${esc(p.why)}</p>` : '') +
      careLabel(b, true) +
      (c ? couponHTML(c, 'cp-line') : '') +
      `<div class="info-row"><a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener">Avaa kauppa ${ext}</a></div>` +
      `</div></div></article>`
    );
  }

  function renderFeed() {
    const items = ordered.filter(productVisible);
    feed.innerHTML = items.length
      ? items.map(cardHTML).join('')
      : `<div class="empty"><p>${
          state.likedOnly
            ? 'Et ole vielä tykännyt mistään. Napauta sydäntä tai kaksoisnapauta vaatetta.'
            : 'Näillä suodattimilla ei löydy vaatteita. Valitse toinen tuotetyyppi tai maa.'
        }</p></div>`;
    feed.scrollTop = 0;
    updateCounter();
  }

  function scrollFeedTo(key) {
    const el = feed.querySelector(`[data-key="${CSS.escape(key)}"]`);
    if (el) feed.scrollTop = el.offsetTop;
    updateCounter();
  }

  function updateCounter() {
    const n = feed.querySelectorAll('.card').length;
    const i = Math.round(feed.scrollTop / (feed.clientHeight || 1));
    $('#feed-count').textContent = n ? `${Math.min(i + 1, n)} / ${n}` : '';
  }
  feed.addEventListener('scroll', () => requestAnimationFrame(updateCounter), { passive: true });

  function toggleLike(key) {
    if (likes.has(key)) likes.delete(key);
    else likes.add(key);
    store.set('vk-likes', [...likes]);
    const on = likes.has(key);
    feed.querySelectorAll(`[data-like="${CSS.escape(key)}"]`).forEach((b) => b.setAttribute('aria-pressed', on));
    const lc = $('#like-count');
    if (lc) lc.textContent = likes.size;
    return on;
  }

  feed.addEventListener('click', (e) => {
    const like = e.target.closest('[data-like]');
    if (like) return toggleLike(like.dataset.like);
    const bo = e.target.closest('[data-brand-open]');
    if (bo) return openBrand(byId.get(bo.dataset.brandOpen));
  });
  feed.addEventListener('dblclick', (e) => {
    const card = e.target.closest('.card');
    if (!card || !e.target.closest('.stage')) return;
    if (!likes.has(card.dataset.key)) toggleLike(card.dataset.key);
    card.classList.remove('pop');
    void card.offsetWidth;
    card.classList.add('pop');
  });

  document.addEventListener('keydown', (e) => {
    if (currentView() !== 'selaa' || !sheet.hidden || e.target.closest?.('select, input, textarea')) return;
    const down = ['ArrowDown', 'j', 'PageDown'].includes(e.key);
    const up = ['ArrowUp', 'k', 'PageUp'].includes(e.key);
    if (!down && !up) return;
    e.preventDefault();
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    feed.scrollBy({ top: (down ? 1 : -1) * feed.clientHeight, behavior: reduce ? 'auto' : 'smooth' });
  });

  // ---------- list ----------
  const SORTS = {
    name: (b) => b.name.toLowerCase(),
    cost: (b) => (b.ship.cost == null ? 999 : b.ship.cost),
    days: (b) => b.ship.days?.[1] ?? 999,
    price: (b) => minPrice(b),
  };

  function renderList() {
    const rows = brands.filter(brandVisible).sort((a, b) => {
      const ka = SORTS[state.sort.key](a);
      const kb = SORTS[state.sort.key](b);
      return (ka > kb ? 1 : ka < kb ? -1 : 0) * state.sort.dir;
    });
    const th = (key, label, cls = '') => {
      const active = state.sort.key === key;
      const aria = active ? (state.sort.dir === 1 ? 'ascending' : 'descending') : 'none';
      return `<th scope="col" class="${cls}" aria-sort="${aria}"><button type="button" data-sort="${key}">${label}${active ? sortIco(state.sort.dir) : ''}</button></th>`;
    };
    const body = rows
      .map((b) => {
        const open = state.open === b.id;
        const d = dayRange(b.ship.days);
        const row =
          `<tr class="row" data-row="${b.id}" tabindex="0" aria-expanded="${open}">` +
          `<td><span class="bname">${esc(b.name)}${nonEu(b) ? `<span class="cc" title="EU:n ulkopuolella">${b.country}</span>` : ''}</span>` +
          `<span class="sub">${esc(b.city ?? countryName(b.country))}</span></td>` +
          `<td class="num">${b.ship.cost == null ? '<span class="sub">kassalla</span>' : eur(b.ship.cost)}${b.ship.freeOver ? `<span class="sub">0 € yli ${nf.format(b.ship.freeOver)}</span>` : ''}</td>` +
          `<td class="num"><span class="days">${stitch(b.ship.speed)}${d ?? '–'}</span></td>` +
          `<td class="num">alk. ${eur(minPrice(b))}</td></tr>`;
        const detail = open
          ? `<tr class="open-detail"><td colspan="4"><div class="detail">${careLabel(b)}<div class="side">` +
            (b.style ? `<p class="style">${esc(b.style)}</p>` : '') +
            couponHTML(bestCoupon(b)) +
            `<div><a class="btn" href="${esc(b.url)}" target="_blank" rel="noopener">Avaa kauppa ${ext}</a></div></div></div></td></tr>`
          : '';
        return row + detail;
      })
      .join('');
    $('#list').innerHTML =
      `<table><thead><tr>${th('name', 'Merkki')}${th('cost', 'Posti', 'num')}${th('days', 'Toimitus', 'num')}${th('price', 'Hinta', 'num')}</tr></thead>` +
      `<tbody>${body || '<tr><td colspan="4">Ei kauppoja näillä suodattimilla.</td></tr>'}</tbody></table>` +
      `<p class="list-note">Postikulut ja toimitusajat Suomeen vakiotoimituksella, tarkistettu ${fiDate(D.checked)}. ` +
      `EU:n ulkopuolelta (merkitty maakoodilla) tilatessa maksetaan Suomen ALV 25,5 % ja 1.7.2026 alkaen 3 €:n tulli tuotelajia kohden. ` +
      `Osa kaupoista perii ne kassalla, osa jättää ne maksettavaksi perillä.</p>`;
  }

  const fiDate = (iso) => iso.split('-').reverse().map(Number).join('.');

  $('#list').addEventListener('click', (e) => {
    if (e.target.closest('a, [data-copy]')) return;
    const s = e.target.closest('[data-sort]');
    if (s) {
      const key = s.dataset.sort;
      state.sort = { key, dir: state.sort.key === key ? -state.sort.dir : 1 };
      return renderList();
    }
    const row = e.target.closest('[data-row]');
    if (row) {
      state.open = state.open === row.dataset.row ? null : row.dataset.row;
      renderList();
      $(`#list [data-row="${CSS.escape(row.dataset.row)}"]`)?.focus({ preventScroll: true });
    }
  });
  $('#list').addEventListener('keydown', (e) => {
    const row = e.target.closest('[data-row]');
    if (row && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      row.click();
    }
  });

  // ---------- views ----------
  const VIEWS = ['kartta', 'selaa', 'lista'];
  const currentView = () => (VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'kartta');

  function showView() {
    const v = currentView();
    document.body.dataset.view = v;
    for (const id of VIEWS) $(`#v-${id}`).hidden = id !== v;
    document.querySelectorAll('[data-nav]').forEach((a) => a.setAttribute('aria-current', a.dataset.nav === v ? 'page' : 'false'));
    if (!sheet.hidden && v !== 'kartta') closeSheet();
    if (v === 'kartta') requestAnimationFrame(fitData);
    if (v === 'selaa') requestAnimationFrame(updateCounter);
  }
  addEventListener('hashchange', showView);

  function renderAll(refit) {
    renderMap();
    renderFeed();
    renderList();
    if (refit && currentView() === 'kartta') fitData();
  }

  $('#meta').textContent = `${brands.length} merkkiä ja ${allProducts.length} vaatetta, hinnat 50–150 €. Tarkistettu ${fiDate(D.checked)}.`;
  renderFilters();
  renderAll(false);
  showView();
  let resizeTimer;
  addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => (currentView() === 'kartta' ? fitData() : renderMap()), 120);
  });
})();
</script>
</body>
</html>
